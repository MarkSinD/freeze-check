name: freeze-check result
description: Share what freeze-check showed from your connection in Russia (no IP addresses, please)
title: "[freeze-check] <operator>, <region>, <date>"
labels: ["freeze-data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for measuring! Results from different operators and regions make the table
        trustworthy. Please do **not** paste your IP address or anything that identifies you.
        Спасибо за замер! Не вставляйте свой IP-адрес и ничего, что вас выдаёт.
  - type: input
    id: operator
    attributes:
      label: Operator / провайдер
      placeholder: "Beeline, MTS, MegaFon, Tele2, Rostelecom, Dom.ru, local ISP..."
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection type / тип подключения
      options:
        - Mobile (LTE/5G) / мобильный
        - Home wired or Wi-Fi / домашний
        - Office / corporate / офис
        - Other / другое
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Region (city or oblast, optional) / регион, по желанию
      placeholder: "Moscow, Novosibirsk oblast..."
  - type: input
    id: date
    attributes:
      label: Date of the run / дата замера
      placeholder: "2026-11-20"
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command / команда
      options:
        - scan --quick
        - scan (full)
        - cdn
        - url (my own server)
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / вывод скрипта
      description: Paste the summary the script printed, or attach the results file from results/.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything unusual? / что-то необычное?
  - type: checkboxes
    id: checks
    attributes:
      label: Checks / проверки
      options:
        - label: The VPN was off during the run (the script showed country RU) / VPN был выключен
          required: true
        - label: I removed IP addresses and anything personal from the paste / IP и личное убрал
          required: true
